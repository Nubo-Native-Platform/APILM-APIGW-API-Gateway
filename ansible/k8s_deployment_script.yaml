apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  strategy:
   type: RollingUpdate
   rollingUpdate:
     maxSurge: 1
     maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        cinum: pipeline-<CINUM>
    spec:
      imagePullSecrets:
      - name: depregcred
      containers:
      - name: api-gateway
        image: <IMAGE>
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  labels:
    name: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    # nodePort: <NODEPORTVALUE>
    name: http-api-gateway
  selector:
    app: api-gateway
